[project]
name = "synapse-crm"
version = "0.3.2"
description = "Lightweight CRM with contact management, deal pipeline, and agent-driven follow-ups"
requires-python = ">=3.13"
dependencies = [
    # Exact pins: the release bundle installs from these constraints, not uv.lock,
    # so a loose range would hand it an untested FastMCP minor. Bump both together.
    "fastmcp>=4.1.4,<4.2",
    "jsonschema>=4.26",
    "mcp>=2.3,<3",
    "pydantic>=2.12",
    "python-ulid>=3.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/synapse_crm"]

[dependency-groups]
dev = [
    "ruff>=0.13.1",
    "ty>=0.0.1a1",
    "pytest>=8.4.2",
    "pytest-asyncio>=0.24.0",
]
